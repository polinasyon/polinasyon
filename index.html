  <script type="module">
    const loaded = {};

    // Tüm modül dosyaları için ortak cache-busting sürümü.
    // Yeni bir deploy sonrası JS'lerin tarayıcı cache'inde bayatlamaması için
    // bu sürümü bump'lamak yeterli (önceden sadece styles.css versiyonlanıyordu).
    const ASSET_VERSION = '2.14';
    const v = (src) => `${src}?v=${ASSET_VERSION}`;

    // YENİ: i18n motoru — tr/en/ru sözlüklerini yükler, [data-i18n*] etiketli
    // tüm elemanları mevcut dile göre çevirir ve dil seçimini localStorage'da
    // saklar. Dil değişince (setLang) veya yeni bir panel/HTML parçası DOM'a
    // eklenince (I18N.apply()) metinler otomatik güncellenir.
    const { I18N } = await import(v('./i18n.js'));
    I18N.init();
    // YENİ: nektar.js ve kovan.js (module olmayan klasik script) bu motora
    // window.I18N üzerinden erişiyor, çünkü onlar 'import' kullanamıyor.
    window.I18N = I18N;

    const langSelector = document.getElementById('langSelector');
    if (langSelector) {
      langSelector.value = I18N.getLang();
      langSelector.addEventListener('change', () => {
        I18N.setLang(langSelector.value);
      });
    }

    function kacisYap(metin) {
      return String(metin ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadScriptOnce(src) {
      if (document.querySelector(`script[data-src="${src}"]`)) return;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.dataset.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(src + ' yüklenemedi'));
        document.body.appendChild(s);
      });
    }

    function errHtml(target, msg) {
      return `<div class="p-4 bg-[#12141a] rounded-xl border border-red-500/30 text-red-400 text-sm" data-i18n="modules.loadingError" data-i18n-param-module="${kacisYap(target)}">${kacisYap(target)} yüklenemedi.<br><span class="text-xs opacity-70">${kacisYap(msg)}</span></div>`;
    }

    // YENİ: hata kutusunu basıp hemen ardından çeviriyi uyguluyor — böylece
    // errHtml() içindeki sabit Türkçe metin, aktif dile göre anında değişir.
    function showErr(el, target, msg) {
      if (!el) return;
      el.innerHTML = errHtml(target, msg);
      I18N.apply(el);
    }

    async function loadModule(target) {
      if (loaded[target]) return;

      try {
        if (target === 'nektar') {
          const el = document.getElementById('nektarModuleContainer');
          if (!el) return;
          await loadScriptOnce(v('floraveritabani.js'));
          await loadScriptOnce(v('floraveritabani-ru.js'));
          await loadScriptOnce(v('floraveritabani-eu.js'));
          await loadScriptOnce(v('bolgeharitasi.js'));
          await loadScriptOnce(v('konum-koordinatlari.js'));
          await loadScriptOnce(v('nektar.js'));
          // Flora birleştirme (RU/EU → tek FLORA_VERITABANI)
          window.FLORA_VERITABANI = Object.assign(
            {},
            window.FLORA_VERITABANI || {},
            window.FLORA_VERITABANI_RU || {},
            window.FLORA_VERITABANI_EU || {}
          );
          if (window.nektarModul?.init) {
            window.nektarModul.init(el);
          } else {
            showErr(el, 'nektar', I18N.t('modules.moduleNotFound', { module: 'window.nektarModul', script: 'nektar.js' }));
            return;
          }
          loaded[target] = true;
        }

        if (target === 'morfometri') {
          const el = document.getElementById('cameraModuleContainer');
          if (!el) return;
          el.innerHTML = getMorfometriShell();
          I18N.apply(el);
          const [{ CameraService }, { RutnerAIEngine }] = await Promise.all([
            import(v('./camera.js')),
            import(v('./rutnerAI.js'))
          ]);
          initMorfometri(CameraService, RutnerAIEngine);
          loaded[target] = true;
        }

        if (target === 'damizlik') {
          const el = document.getElementById('pedigreeModuleContainer');
          if (!el) return;
          // Sadece DOM iskeleti — mantık pedigree.js'te
          el.innerHTML = getPedigreeShell();
          I18N.apply(el);
          const { PedigreeModule } = await import(v('./pedigree.js'));
          const mod = new PedigreeModule();
          mod.init();
          loaded[target] = true;
        }

        if (target === 'akademi') {
          loadRSS();
          loaded[target] = true;
        }

        if (target === 'hive') {
          const el = document.getElementById('hiveModuleContainer');
          if (!el) return;

          await loadScriptOnce(v('kovan.js'));

          if (window.kovanModul && typeof window.kovanModul.init === 'function') {
            window.kovanModul.init(el);
          } else {
            // DÜZELTİLDİ: önceden burada tanımsız olan errBox() çağrılıyordu
            // (doğru fonksiyon adı errHtml) — bu satır ReferenceError fırlatıyordu.
            showErr(el, 'hive', I18N.t('modules.moduleNotFound', { module: 'kovanModul', script: 'kovan.js' }));
            return;
          }
          loaded[target] = true;
        }
      } catch (err) {
        console.error(target, err);
        const map = {
          nektar: 'nektarModuleContainer',
          morfometri: 'cameraModuleContainer',
          damizlik: 'pedigreeModuleContainer',
          hive: 'hiveModuleContainer'
        };
        const el = document.getElementById(map[target]);
        showErr(el, target, err.message);
      }
    }

    function initMorfometri(CameraService, RutnerAIEngine) {
      let colonySamples = [];
      let currentMetrics = null;
      let currentPilosity = null; // YENİ: aktif örneğin pilosity değeri (varsa)
      let tapMode = 'wing'; // YENİ: 'wing' | 'pilosity' — canvas dokunuşunun ne anlama geldiğini belirler

      const video = document.getElementById('videoElement');
      const canvas = document.getElementById('canvasElement');
      const placeholder = document.getElementById('camPlaceholder');
      const startBtn = document.getElementById('startCamBtn');
      const captureBtn = document.getElementById('captureBtn');
      const pilosityBtn = document.getElementById('pilosityBtn'); // YENİ
      const addBtn = document.getElementById('addSampleBtn');
      const analyzeBtn = document.getElementById('analyzeColonyBtn');
      const ciEl = document.getElementById('ciValue');
      const diEl = document.getElementById('diValue');
      const pilosityEl = document.getElementById('pilosityValue'); // YENİ
      const manualPilosityInput = document.getElementById('manualPilosity'); // YENİ
      const sampleList = document.getElementById('sampleList');
      const sonucEl = document.getElementById('rutnerSonuc');

      const camera = new CameraService(video, canvas, placeholder);

      startBtn.onclick = async () => {
        const active = await camera.toggle();
        startBtn.dataset.i18n = active ? 'morphometry.closeCamera' : 'morphometry.openCamera';
        startBtn.textContent = I18N.t(startBtn.dataset.i18n);
        captureBtn.disabled = !active;
        pilosityBtn.disabled = !active; // YENİ
      };

      captureBtn.disabled = true;
      captureBtn.dataset.state = 'idle';
      captureBtn.onclick = () => {
        if (captureBtn.dataset.state === 'captured') {
          camera.resetPoints();
          captureBtn.dataset.state = 'idle';
          captureBtn.dataset.i18n = 'morphometry.takePhoto';
          captureBtn.textContent = I18N.t(captureBtn.dataset.i18n);
          ciEl.textContent = '—';
          diEl.textContent = '—';
          currentMetrics = null;
          addBtn.disabled = true;
          tapMode = 'wing'; // YENİ
          return;
        }
        tapMode = 'wing'; // YENİ: kanat fotoğrafı çekilirken dokunma modu 'wing' olmalı
        const v = camera.captureAndValidate();
        if (!v.valid) {
          alert(v.reason || I18N.t('alerts.captureInvalid'));
          return;
        }
        captureBtn.dataset.state = 'captured';
        captureBtn.dataset.i18n = 'morphometry.cancelRetake';
        captureBtn.textContent = I18N.t(captureBtn.dataset.i18n);
        if (v.autoDetected && v.metrics) {
          currentMetrics = v.metrics;
          ciEl.textContent = v.metrics.ci;
          diEl.textContent = v.metrics.di;
          addBtn.disabled = false;
        } else {
          alert(I18N.t('alerts.wingDetected'));
        }
      };

      // YENİ: Tüy yoğunluğu (pilosity) — kanat fotoğrafından BAĞIMSIZ ayrı bir
      // çekim. Doğru sonuç için kullanıcı burada arının karnına/5. tergit
      // bölgesine yakın çekim yapmalıdır (bkz. camera.js'teki bilimsel not —
      // bu bir mikroskop ölçümünün yerini tutmaz, kaba bir yaklaşıklamadır).
      pilosityBtn.disabled = true;
      pilosityBtn.onclick = async () => {
        const res = await camera.capturePilosityPhoto();
        if (!res.valid) {
          alert(res.reason || I18N.t('alerts.captureInvalid'));
          return;
        }
        tapMode = 'pilosity';
        camera.clearManualPilosity();
        currentPilosity = null;
        pilosityEl.textContent = '—';
        if (manualPilosityInput) manualPilosityInput.value = '';
        alert(I18N.t('alerts.tergitePhotoTaken'));
      };

      const onPoint = (e) => {
        if (e.cancelable) e.preventDefault();
        if (canvas.style.display === 'none') return;
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const px = (cx - rect.left) * sx;
        const py = (cy - rect.top) * sy;

        // YENİ: pilosity modundaysak dokunulan nokta wing A-B-C'ye değil,
        // tüy yoğunluğu ROI merkezine gider.
        if (tapMode === 'pilosity') {
          const est = camera.estimatePilosity(px, py);
          if (est != null) {
            currentPilosity = est;
            pilosityEl.textContent = est.toFixed(3);
          } else {
            alert(I18N.t('alerts.pilosityFailed'));
          }
          return;
        }

        const metrics = camera.addPoint(px, py);
        if (metrics) {
          currentMetrics = metrics;
          ciEl.textContent = metrics.ci;
          diEl.textContent = metrics.di;
          addBtn.disabled = false;
        }
      };
      canvas.addEventListener(window.PointerEvent ? 'pointerdown' : 'click', onPoint);

      // YENİ: manuel pilosity girişi — sağlanırsa CV tahmininin her zaman önüne geçer
      manualPilosityInput?.addEventListener('change', () => {
        const raw = parseFloat(manualPilosityInput.value);
        if (isNaN(raw)) {
          camera.clearManualPilosity();
          currentPilosity = null;
          pilosityEl.textContent = '—';
          return;
        }
        const normalized = camera.setManualPilosity(raw);
        if (normalized != null) {
          currentPilosity = normalized;
          pilosityEl.textContent = `${normalized.toFixed(3)} (manuel)`;
        }
      });

      addBtn.disabled = true;
      addBtn.onclick = () => {
        if (!currentMetrics) return;
        let a4 = null;
        const a = parseFloat(document.getElementById('a4DistA')?.value);
        const b = parseFloat(document.getElementById('a4DistB')?.value);
        if (!isNaN(a) && !isNaN(b) && typeof RutnerAIEngine.calculateA4FromDistances === 'function') {
          a4 = RutnerAIEngine.calculateA4FromDistances(a, b);
        }

        colonySamples.push({
          ci: currentMetrics.ci,
          discoidal: currentMetrics.rawDiscoidal,
          a4Angle: a4,
          pilosity: currentPilosity // YENİ — artık gerçekten dolduruluyor
        });
        const empty = document.getElementById('emptyListText');
        if (empty) empty.remove();
        const li = document.createElement('li');
        li.className = 'py-1.5 border-b border-[#282f3d] text-slate-300 text-xs';
        li.dataset.i18n = 'morphometry.beeSampleText';
        li.dataset.i18nParamIndex = colonySamples.length;
        li.dataset.i18nParamCi = currentMetrics.ci;
        li.dataset.i18nParamDi = currentMetrics.rawDiscoidal;
        li.dataset.i18nParamA4 = a4 != null ? a4 : '—';
        li.dataset.i18nParamPilosity = currentPilosity != null ? currentPilosity.toFixed(2) : '—';
        sampleList.appendChild(li);
        I18N.apply(li);

        camera.resetPoints();
        camera.resetPilosity(); // YENİ: bir sonraki arı için pilosity oturumu sıfırlanır
        currentMetrics = null;
        currentPilosity = null; // YENİ
        ciEl.textContent = '—';
        diEl.textContent = '—';
        pilosityEl.textContent = '—'; // YENİ
        addBtn.disabled = true;
        captureBtn.dataset.state = 'idle';
        captureBtn.dataset.i18n = 'morphometry.takePhoto';
        captureBtn.textContent = I18N.t(captureBtn.dataset.i18n);
        tapMode = 'wing'; // YENİ
        if (document.getElementById('a4DistA')) document.getElementById('a4DistA').value = '';
        if (document.getElementById('a4DistB')) document.getElementById('a4DistB').value = '';
        if (manualPilosityInput) manualPilosityInput.value = ''; // YENİ
        analyzeBtn.disabled = colonySamples.length === 0;
      };

      analyzeBtn.disabled = true;
      analyzeBtn.onclick = () => {
        if (!colonySamples.length) return;
        const ai = RutnerAIEngine.analyzeColony(colonySamples);
        try {
          localStorage.setItem('polinasyon_last_morph', JSON.stringify({
            ...ai, n: colonySamples.length, date: new Date().toISOString()
          }));
        } catch (_) {}
        sonucEl.classList.remove('hidden');
        sonucEl.innerHTML = `
          <p class="font-bold text-amber-400 mb-1" data-i18n="morphometry.rutnerResult" data-i18n-param-count="${colonySamples.length}">Rutner AI (${colonySamples.length} arı)</p>
          <p><span data-i18n="morphometry.detection">Tespit</span>: <strong>${kacisYap(ai.predictedRace || '—')}</strong></p>
          <p><span data-i18n="morphometry.confidence">Güven</span>: <strong>%${ai.confidence ?? '—'}</strong></p>
          ${ai.avgPilosity != null ? `<p class="text-xs text-slate-500"><span data-i18n="morphometry.avgPilosity">Ort. Pilosity</span>: ${ai.avgPilosity}</p>` : ''}
          <p class="mt-1 text-xs ${ai.isHybrid ? 'text-rose-400' : 'text-emerald-400'}" data-i18n="${ai.isHybrid ? 'morphometry.highVariation' : 'morphometry.stableStandard'}">
            ${ai.isHybrid ? 'Yüksek varyasyon / olası melez' : 'Stabil / standart uyumlu'}
          </p>
          ${ai.recommendation && ai.recommendation[0] ? `<p class="mt-2 text-[11px] text-slate-500 italic">${kacisYap(ai.recommendation[0])}</p>` : ''}`;
        I18N.apply(sonucEl);
      };
    }

    // YENİ: dil koduna göre tarih yerel biçimi (RSS gönderi tarihleri için)
    const RSS_DATE_LOCALES = { tr: 'tr-TR', en: 'en-US', ru: 'ru-RU' };

    async function loadRSS() {
      const c = document.getElementById('rssFeedContainer');
      if (!c) return;

      // Yükleniyor durumu
      c.innerHTML = `
        <div class="p-4 bg-[#12141a] rounded-xl border border-[#282f3d] text-center text-slate-400 text-xs animate-pulse" data-i18n="academy.loadingPosts">
          Yazılar yükleniyor...
        </div>`;
      I18N.apply(c);

      const rssUrl = 'https://www.polinasyon.org/rss.xml';
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok' && data.items.length > 0) {
          c.innerHTML = ''; // Önceki içeriği temizle

          const dateLocale = RSS_DATE_LOCALES[I18N.getLang()] || 'tr-TR';

          // Gelen yazılardan ilk 2 veya 3 tanesini döngüye alalım
          data.items.slice(0, 3).forEach(item => {
            // Tarihi düzenleme (aktif dile göre yerelleştirilir)
            const date = new Date(item.pubDate).toLocaleDateString(dateLocale, { day: 'numeric', month: 'long', year: 'numeric' });

            // İçerikteki HTML etiketlerini temizleyip kısa bir açıklama (snippet) elde edelim
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = item.description || item.content || '';
            let snippet = tempDiv.textContent || tempDiv.innerText || '';
            if (snippet.length > 90) snippet = snippet.substring(0, 90) + '...';

            // DÜZELTİLDİ: item.link doğrudan href'e yazılmadan önce şema kontrolü
            // yapılıyor — kötü niyetli bir RSS/proxy yanıtı "javascript:" gibi bir
            // URI dönerse tıklandığında çalışmasının önüne geçiliyor.
            const safeLink = typeof item.link === 'string' && /^https?:\/\//i.test(item.link)
              ? item.link
              : '#';

            const itemElement = document.createElement('a');
            itemElement.href = safeLink;
            itemElement.target = '_blank';
            itemElement.rel = 'noopener';
            itemElement.className = 'block p-4 bg-[#12141a] rounded-xl border border-[#282f3d] hover:border-amber-400/50 transition group';

            // DÜZELTİLDİ: item.title ve snippet önceden hiç escape edilmeden
            // innerHTML'e yazılıyordu (RSS/proxy kaynaklı XSS riski). Artık
            // kacisYap() ile escape ediliyor.
            itemElement.innerHTML = `
              <div class="flex justify-between items-center mb-1">
                <h3 class="text-xs font-bold text-white group-hover:text-amber-400 transition">${kacisYap(item.title)}</h3>
                <span class="text-[9px] text-slate-500">${kacisYap(date)}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">${kacisYap(snippet)}</p>
              <span class="text-[10px] text-amber-400/80 mt-2 block" data-i18n="academy.source">Kaynak: polinasyon.org</span>
            `;

            c.appendChild(itemElement);
          });
          I18N.apply(c);
        } else {
          c.innerHTML = `<div class="p-4 bg-[#12141a] rounded-xl border border-[#282f3d] text-center text-red-400 text-xs" data-i18n="academy.loadFailed">Yazılar yüklenemedi.</div>`;
          I18N.apply(c);
        }
      } catch (error) {
        c.innerHTML = `<div class="p-4 bg-[#12141a] rounded-xl border border-[#282f3d] text-center text-red-400 text-xs" data-i18n="academy.errorOccurred">Bir hata oluştu.</div>`;
        I18N.apply(c);
      }
    }

    function showPanel(target) {
      document.getElementById('dashboardView').style.display = 'none';
      document.querySelectorAll('.content-panel').forEach((p) => {
        p.style.display = 'none';
        p.classList.remove('active');
      });
      const panel = document.getElementById(target + 'Panel');
      if (panel) {
        panel.style.display = 'block';
        panel.classList.add('active');
      }
    }

    function showHome() {
      document.getElementById('dashboardView').style.display = 'block';
      document.querySelectorAll('.content-panel').forEach((p) => {
        p.style.display = 'none';
        p.classList.remove('active');
      });
    }

    document.addEventListener('click', async (e) => {
      const card = e.target.closest('.main-menu-card');
      if (card) {
        e.preventDefault();
        showPanel(card.dataset.target);
        await loadModule(card.dataset.target);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      if (e.target.closest('#homeHeaderBtn')) {
        showHome();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }, true);

    // EKLENDİ: header'a klavye erişilebilirliği. Önceden role="button"
    // tabindex="0" vardı ama Enter/Space için bir dinleyici yoktu — klavye
    // kullanıcıları ana sayfaya bu şekilde dönemiyordu.
    document.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('#homeHeaderBtn')) {
        e.preventDefault();
        showHome();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    document.getElementById('exportBackupBtn')?.addEventListener('click', () => {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k?.startsWith('polinasyon_')) data[k] = localStorage.getItem(k);
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      a.download = `polinasyon_yedek_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    });

    // DÜZELTİLDİ: içe aktarma artık (1) yüklenen dosyanın gerçekten bir
    // Polinasyon yedeği olduğunu kontrol ediyor, (2) mevcut yerel veriler
    // üzerine yazmadan önce onay istiyor, (3) aynı dosyayı art arda
    // seçebilmek için input değerini sıfırlıyor.
    document.getElementById('importBackupInput')?.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data || typeof data !== 'object' || Array.isArray(data)) {
            alert('Geçersiz yedek dosyası formatı.');
            return;
          }
          const keys = Object.keys(data).filter((k) => k.startsWith('polinasyon_'));
          if (keys.length === 0) {
            alert('Bu dosyada geçerli bir Polinasyon yedeği bulunamadı.');
            return;
          }
          if (!confirm(`${keys.length} adet veri anahtarı bulundu. Mevcut yerel veriler üzerine yazılacak. Devam edilsin mi?`)) {
            return;
          }
          keys.forEach((k) => localStorage.setItem(k, data[k]));
          location.reload();
        } catch {
          alert('Geçersiz yedek (JSON ayrıştırılamadı).');
        }
      };
      r.readAsText(file);
      e.target.value = '';
    });

          <p class="text-xs text-slate-400" data-i18n="morphometry.subtitle">Kanat A–B–C → CI / DI. 10–15 örnekle koloni ırk tahmini.</p>
          <div class="relative w-full aspect-video bg-[#0f1115] rounded-xl overflow-hidden border border-[#282f3d]">
            <div id="camPlaceholder" class="absolute inset-0 flex items-center justify-center text-slate-500 text-sm" data-i18n="morphometry.cameraOff">Kamera kapalı</div>
            <video id="videoElement" playsinline aria-label="Canlı kamera görüntüsü — kanat konumlandırma" class="w-full h-full object-cover" style="display:none"></video>
            <canvas id="canvasElement" role="img" aria-label="Çekilen kanat fotoğrafı ve A-B-C ölçüm noktaları" class="w-full h-full" style="display:none"></canvas>
          </div>
          <div class="grid grid-cols-2 gap-2 text-center text-sm">
            <div class="bg-[#12141a] p-3 rounded-xl border border-[#282f3d]"><div class="text-xs text-slate-400" data-i18n="morphometry.ci">CI</div><div id="ciValue" class="font-bold text-amber-400 mt-1">—</div></div>
            <div class="bg-[#12141a] p-3 rounded-xl border border-[#282f3d]"><div class="text-xs text-slate-400" data-i18n="morphometry.di">DI</div><div id="diValue" class="font-bold text-sky-400 mt-1">—</div></div>
          </div>
          <!-- YENİ: Pilosity (tüy yoğunluğu) — kanat fotoğrafından BAĞIMSIZ, ayrı bir karın/tergit fotoğrafı gerektirir -->
          <div class="bg-[#12141a] p-3 rounded-xl border border-[#282f3d] text-center text-sm">
            <div class="text-xs text-slate-400" data-i18n="morphometry.pilosityEstimate">Pilosity (yaklaşık — ops., karın/tergit fotoğrafı gerekir)</div>
            <div id="pilosityValue" class="font-bold text-emerald-400 mt-1">—</div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="a4DistA" data-i18n-placeholder="morphometry.a4DistA" placeholder="A4 mesafe A (ops.)" class="bg-[#12141a] border border-[#282f3d] rounded-lg px-3 py-2 text-xs text-white">
            <input id="a4DistB" data-i18n-placeholder="morphometry.a4DistB" placeholder="A4 mesafe B (ops.)" class="bg-[#12141a] border border-[#282f3d] rounded-lg px-3 py-2 text-xs text-white">
          </div>
          <!-- YENİ: gerçek bir mikroskop/loop ölçümü varsa CV tahminini geçersiz kılar -->
          <input id="manualPilosity" type="number" step="0.01" min="0" max="1" data-i18n-placeholder="morphometry.manualPilosity" placeholder="Manuel pilosity (ör. 0.30 — mikroskop ölçümü, ops.)" class="w-full bg-[#12141a] border border-[#282f3d] rounded-lg px-3 py-2 text-xs text-white">
          <div class="flex flex-wrap gap-2">
            <button type="button" id="startCamBtn" class="flex-1 min-w-[110px] py-2.5 rounded-xl bg-amber-500 text-black font-bold text-sm" data-i18n="morphometry.openCamera">Kamerayı Aç</button>
            <button type="button" id="captureBtn" class="flex-1 min-w-[110px] py-2.5 rounded-xl bg-[#282f3d] text-slate-300 text-sm" disabled data-i18n="morphometry.takePhoto">Fotoğraf Çek</button>
            <button type="button" id="pilosityBtn" class="flex-1 min-w-[110px] py-2.5 rounded-xl bg-[#282f3d] text-slate-300 text-sm" disabled data-i18n="morphometry.pilosityPhoto">Tüy Yoğunluğu Fotoğrafı</button>
            <button type="button" id="addSampleBtn" class="flex-1 min-w-[110px] py-2.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 text-sm" disabled data-i18n="morphometry.addSample">Örnek Ekle</button>
            <button type="button" id="analyzeColonyBtn" class="flex-1 min-w-[110px] py-2.5 rounded-xl bg-sky-600/20 border border-sky-500/40 text-sky-400 text-sm" disabled data-i18n="morphometry.analyzeRutner">Rutner AI</button>
          </div>
          <ul id="sampleList" class="text-xs max-h-40 overflow-y-auto border border-[#282f3d] rounded-xl p-2">
            <li id="emptyListText" class="py-3 text-center text-slate-500" data-i18n="morphometry.noMeasurement">Henüz ölçüm yok (hedef: 10–15 arı)</li>
          </ul>
          <div id="rutnerSonuc" class="hidden p-4 rounded-xl border border-amber-500/30 bg-amber-950/20 text-sm"></div>
        </div>`;
    }
  </script>
  <!-- DÜZELTİLDİ: aynı service worker'ı kaydeden iki neredeyse özdeş <script>
       bloğu tek bir bloğa birleştirildi (önceki sürümde tekrar kayıt gereksiz
       yere iki kez yapılıyordu). -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./sw.js', { scope: './' })
        .then((reg) => {
          console.log('[PWA] SW kayıtlı:', reg.scope);
          // Yeni sürüm gelince hemen aktive et
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // İstersen burada "Yeni sürüm var, yenile" bildirimi göster
                console.log('[PWA] Yeni sürüm hazır');
              }
            });
          });
        })
        .catch((err) => console.warn('[PWA] SW kayıt hatası:', err));
    });
  }
</script>
</body>
</html>
